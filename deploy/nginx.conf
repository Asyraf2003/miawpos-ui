# Static-host reference. Set the host, TLS certificate paths, dist location and upstream.
# Publish the exact dist that passed the gate; do not rebuild on this host.
server {
    listen 443 ssl;
    server_name miawpos.example;
    ssl_certificate /etc/ssl/miawpos/fullchain.pem;
    ssl_certificate_key /etc/ssl/miawpos/privkey.pem;
    root /srv/miawpos/dist;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api { proxy_pass http://127.0.0.1:8081; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
